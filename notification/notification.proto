syntax = "proto3";

package notification.v1;

option go_package = "github.com/bvbl1/masterhub-proto/golang/notification;notificationpb";

import "google/api/annotations.proto";

service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);

  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option (google.api.http) = {
      get: "/v1/notifications"
    };
  }

  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse) {
    option (google.api.http) = {
      patch: "/v1/notifications/{id}/read"
      body: "*"
    };
  }

  rpc SendTelegramNotification(SendTelegramRequest) returns (SendTelegramResponse);
}

message Notification {
  int64  id         = 1;
  int64  user_id    = 2;
  string title      = 3;
  string body       = 4;
  string type       = 5;
  bool   is_read    = 6;
  string created_at = 7;
}

message SendNotificationRequest {
  int64  user_id = 1;
  string email   = 2;
  string title   = 3;
  string body    = 4;
  string type    = 5;
}

message SendNotificationResponse {
  bool success = 1;
}

message ListNotificationsRequest {
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

message MarkNotificationReadRequest {
  int64 id = 1;
}

message MarkNotificationReadResponse {
  bool success = 1;
}

message SendTelegramRequest {
  int64 chat_id = 1;
  string text   = 2;
}

message SendTelegramResponse {
  bool success = 1;
}
