syntax = "proto3";

package chat.v1;

option go_package = "github.com/bvbl1/masterhub-proto/golang/chat;chatpb";

import "google/api/annotations.proto";

service ChatService {
  rpc GetOrCreateConversation(GetOrCreateConversationRequest) returns (GetOrCreateConversationResponse) {
    option (google.api.http) = {
      post: "/v1/conversations"
      body: "*"
    };
  }

  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option (google.api.http) = {
      get: "/v1/conversations"
    };
  }

  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse) {
    option (google.api.http) = {
      get: "/v1/conversations/{conversation_id}/messages"
    };
  }

  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse) {
    option (google.api.http) = {
      patch: "/v1/conversations/{conversation_id}/messages/read"
      body: "*"
    };
  }
}

message Conversation {
  int64  id          = 1;
  int64  customer_id = 2;
  int64  provider_id = 3;
  string created_at  = 4;
  string last_message_at = 5;
}

message Message {
  int64  id              = 1;
  int64  conversation_id = 2;
  int64  sender_id       = 3;
  string content         = 4;
  bool   is_read         = 5;
  string created_at      = 6;
  optional string media_url = 7;
}

// GetOrCreateConversation
message GetOrCreateConversationRequest {
  int64 provider_id = 1;
}

message GetOrCreateConversationResponse {
  Conversation conversation = 1;
}

// ListConversations
message ListConversationsRequest {}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

// GetMessages
message GetMessagesRequest {
  int64 conversation_id = 1;
  int32 limit           = 2;
  int32 offset          = 3;
}

message GetMessagesResponse {
  repeated Message messages = 1;
}

// MarkAsRead
message MarkAsReadRequest {
  int64 conversation_id = 1;
}

message MarkAsReadResponse {
  bool success = 1;
}