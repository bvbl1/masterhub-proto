syntax = "proto3";

package user.v1;

option go_package = "github.com/bvbl1/masterhub-proto/golang/user;userpb";


//Service

service UserService {
  rpc CreateUser        (CreateUserRequest)        returns (CreateUserResponse);
  rpc GetUserById       (GetUserRequestById)       returns (GetUserResponse);
  rpc GetUserByEmail    (GetUserRequestByEmail)    returns (GetUserResponse);
  rpc GetUserByPhone    (GetUserRequestByPhone)    returns (GetUserResponse);
  rpc ListUsers         (ListUsersRequest)         returns (ListUsersResponse);
  rpc UpdateUser        (UpdateUserRequest)        returns (UpdateUserResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
}


//Messages

message User {
  int64  id          = 1;
  string first_name  = 2;
  string second_name = 3;
  string email       = 4;
  string phone       = 5;
  string role = 6;
}


//Requests / Responses

message CreateUserRequest {
  string first_name  = 1;
  string second_name = 2;
  string email       = 3;
  string phone       = 4;
  string password    = 5;
  
  reserved 6;
  reserved "role";
}

message CreateUserResponse {
  int64 user_id = 1;
  string token = 2;
}


//Get user

message GetUserRequestById {
  int64 user_id = 1;
}

message GetUserRequestByEmail {
  string email = 1;
}

message GetUserRequestByPhone {
  string phone = 1;
}

message GetUserResponse {
  User user = 1;
}


//List users

message ListUsersRequest {
  int32 limit  = 1;
  int32 offset = 2;
}

message ListUsersResponse {
  repeated User users = 1;
}


//Update user

message UpdateUserRequest {
  int64  user_id     = 1;
  string first_name  = 2;
  string second_name = 3;
  string email       = 4;
  string phone       = 5;
  string role        = 6;
}

message UpdateUserResponse {
  User user = 1;
}

//Login 
message LoginRequest {
  string email_or_phone = 1;
  string password       = 2;
}

message LoginResponse {
  string token  = 1;
  User   user   = 2;
}