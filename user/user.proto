syntax = "proto3";

package user.v1;
import "google/api/annotations.proto";

option go_package = "github.com/bvbl1/masterhub-proto/golang/user;userpb";


// Service with REST annotations
service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/user"
      body: "*" 
    };
  }

  rpc GetUserById(GetUserRequestById) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}"
    };
  }

  rpc GetUserByEmail(GetUserRequestByEmail) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/users/email/{email}"
    };
  }

  rpc GetUserByPhone(GetUserRequestByPhone) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/users/phone/{phone}"
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put: "/v1/users/{user_id}"
      body: "*" 
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  rpc PromoteToProvider(PromoteToProviderRequest) returns (PromoteToProviderResponse) {
    option (google.api.http) = {
      post: "/v1/user/provider"
      body: "*"
    };
  }

  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {
      get: "/v1/users/me"
    };
  }

  rpc GetGoogleAuthURL(GetGoogleAuthURLRequest) returns (GetGoogleAuthURLResponse) {
    option (google.api.http) = {
      get: "/v1/auth/google"
    };
  }

  rpc GoogleAuthCallback(GoogleAuthCallbackRequest) returns (GoogleAuthCallbackResponse) {
    option (google.api.http) = {
      get: "/v1/auth/google/callback"
    };
  }

  rpc UpdateAvatar(UpdateAvatarRequest) returns (UpdateAvatarResponse) {
    option (google.api.http) = {
      post: "/v1/users/me/avatar"
    body: "*"
  };
  }

  rpc LinkTelegramByToken(LinkTelegramRequest) returns (LinkTelegramResponse);
  
  rpc GenerateTelegramToken(GenerateTelegramTokenRequest) returns (GenerateTelegramTokenResponse);

  rpc SubmitProviderApplication(SubmitProviderApplicationRequest) returns (SubmitProviderApplicationResponse) {
    option (google.api.http) = {
      post: "/v1/user/provider/apply"
      body: "*"
    };
  }

  rpc GetMyProviderApplication(GetMyProviderApplicationRequest) returns (GetMyProviderApplicationResponse) {
    option (google.api.http) = {
      get: "/v1/user/provider/application"
    };
  }

  // === Admin RPCs ===

  rpc ListProviderApplications(ListProviderApplicationsRequest) returns (ListProviderApplicationsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/provider-applications"
    };
  }

  rpc ApproveProviderApplication(ApproveProviderApplicationRequest) returns (ApproveProviderApplicationResponse) {
    option (google.api.http) = {
      post: "/v1/admin/provider-applications/{application_id}/approve"
      body: "*"
    };
  }

  rpc RejectProviderApplication(RejectProviderApplicationRequest) returns (RejectProviderApplicationResponse) {
    option (google.api.http) = {
      post: "/v1/admin/provider-applications/{application_id}/reject"
      body: "*"
    };
  }
}
//Messages

message User {
  int64  id          = 1;
  string first_name  = 2;
  string second_name = 3;
  string email       = 4;
  string phone       = 5;
  string role = 6;
  string avatar_url = 7;
}

message ProviderApplication {
  int64  id               = 1;
  int64  user_id          = 2;
  string status           = 3; // pending | approved | rejected
  repeated string document_urls = 4;
  string rejection_reason = 5;
  int64  reviewed_by      = 6;
  string created_at       = 7;
  string updated_at       = 8;
}

//Requests / Responses

message CreateUserRequest {
  string first_name  = 1;
  string second_name = 2;
  string email       = 3;
  string phone       = 4;
  string password    = 5;
  
  reserved 6;
  reserved "role";
}

message CreateUserResponse {
  int64 user_id = 1;
  string token = 2;
}


//Get user

message GetUserRequestById {
  int64 user_id = 1;
}

message GetUserRequestByEmail {
  string email = 1;
}

message GetUserRequestByPhone {
  string phone = 1;
}

message GetUserResponse {
  User user = 1;
}


//List users

message ListUsersRequest {
  int32 limit  = 1;
  int32 offset = 2;
}

message ListUsersResponse {
  repeated User users = 1;
}


//Update user

message UpdateUserRequest {
  int64  user_id     = 1;
  string first_name  = 2;
  string second_name = 3;
  string email       = 4;
  string phone       = 5;
  string role        = 6;
}

message UpdateUserResponse {
  User user = 1;
}

//Login 
message LoginRequest {
  string email_or_phone = 1;
  string password       = 2;
}

message LoginResponse {
  string token  = 1;
  User   user   = 2;
}

//PromoteToProvider
message PromoteToProviderRequest {}

message PromoteToProviderResponse {
  string role = 1;
  string token = 2;
}

message SubmitProviderApplicationRequest {
  repeated string document_urls = 1;
}

message SubmitProviderApplicationResponse {
  ProviderApplication application = 1;
}

// Get own
message GetMyProviderApplicationRequest {}

message GetMyProviderApplicationResponse {
  ProviderApplication application = 1;
}

// List (admin)
message ListProviderApplicationsRequest {
  string status = 1; // filter: pending | approved | rejected | "" for all
  int32  limit  = 2;
  int32  offset = 3;
}

message ListProviderApplicationsResponse {
  repeated ProviderApplication applications = 1;
  int32 total = 2;
}

// Approve (admin)
message ApproveProviderApplicationRequest {
  int64 application_id = 1;
}

message ApproveProviderApplicationResponse {
  ProviderApplication application = 1;
  string new_token = 2; // freshly issued JWT with role=provider, returned to admin who can pass it along — or omit and let user re-login
}

// Reject (admin)
message RejectProviderApplicationRequest {
  int64  application_id    = 1;
  string rejection_reason  = 2;
}

message RejectProviderApplicationResponse {
  ProviderApplication application = 1;
}

//GetMe
message GetMeRequest{}

message GetMeResponse {
  User user = 1;
}

//google auth
message GetGoogleAuthURLRequest {}

message GetGoogleAuthURLResponse {
  string url = 1;
}

message GoogleAuthCallbackRequest {
  string code  = 1;
  string state = 2;
}

message GoogleAuthCallbackResponse {
  string token = 1;
  User   user  = 2;
}

message UpdateAvatarRequest {
  string avatar_url = 1;
}

message UpdateAvatarResponse {
  bool success = 1;
}

message LinkTelegramRequest {
  string token  = 1;
  int64  chat_id = 2;
}

message LinkTelegramResponse {
  int64  user_id    = 1;
  string first_name = 2;
  string role       = 3;
  string token      = 4;
}

message GenerateTelegramTokenRequest {
  int64 user_id = 1;
}

message GenerateTelegramTokenResponse {
  string token = 1;
}
